[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roy-organizer"
version = "0.1.0"
description = "A privacy-first, safety-first Mac file organizer for humans and developers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "abhishroy", email = "abhiroy2405@gmail.com"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: MacOS"]

[project.scripts]
roy = "roy:main"

[tool.setuptools]
py-modules = ["roy", "roy_ai", "roy_alias_cleanup", "roy_analytics", "roy_classify", "roy_config", "roy_demo", "roy_doctor", "roy_executor", "roy_gui", "roy_inspect", "roy_plan", "roy_pilot", "roy_safety", "roy_scan", "roy_transactions", "roy_tui", "roy_validate"]
